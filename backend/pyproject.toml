[project]
name = "atlas-ai-backend"
version = "0.1.0"
description = "Atlas AI backend service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "neo4j>=5.28.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
